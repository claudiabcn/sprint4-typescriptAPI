<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jokes Website</title>
    <link rel="icon" type="image/jpg" href="./assets/img/faviconJoke.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./styles/tailwind.config.js"></script>
  </head>

<body 
  class="min-h-screen p-4 bg-no-repeat bg-center overflow-hidden"
  style="background-image: url('./assets/img/bg.png');background-size: 1300px;" 
>
  <div 
    class="absolute top-[100px] left-[100px] w-64 h-64 rounded-full mix-blend-multiply 
           bg-no-repeat bg-cover bg-center"
    style="background-image: url('./assets/img/bg.png');" 
  ></div>

  <div 
    class="absolute bottom-[100px] right-[100px] w-80 h-80 rounded-full mix-blend-multiply 
           bg-no-repeat bg-cover bg-center"
    style="background-image: url('./assets/img/bg.png');" 
  ></div>
  
    <div class="flex flex-col items-center justify-center min-h-screen gap-6">
      <header
        class="w-full max-w-md bg-[#EFF6FF] rounded-2xl border-2 border-blue-200 shadow-lg p-4 text-xl"
        id="weather"
      >
        <section class="text-center" id="weather__display">
          <p class="text-gray-500 text-xl">Loading weather...</p>
        </section>
      </header>

      <div
        class="bg-white p-6 md:p-10 rounded-xl shadow-2xl max-w-lg w-full text-center"
      >
        <h1 class="text-3xl font-bold text-primary mb-6">✨ Jokes ✨</h1>

        <p
          id="joke"
          class="text-xl text-gray-700 mb-8 min-h-[50px] flex items-center justify-center"
        >
          Loading joke...
        </p>

        <div class="flex flex-wrap gap-4 mb-4 justify-center">
          <button
            id="btn-score1"
            class="bg-primary hover:bg-fuchsia-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 shadow-md hover:shadow-lg"
          >
            ah :|
          </button>
          <button
            id="btn-score2"
            class="bg-primary hover:bg-fuchsia-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 shadow-md hover:shadow-lg"
          >
            haha :)
          </button>
          <button
            id="btn-score3"
            class="bg-primary hover:bg-fuchsia-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 shadow-md hover:shadow-lg"
          >
            hahahah :D
          </button>
        </div>

        <div>
          <button
            id="btn"
            class="bg-primary hover:bg-fuchsia-600 text-white font-semibold py-2 px-6 rounded-lg transition duration-200 shadow-md hover:shadow-lg"
          >
            Next joke
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
