<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jokes Website</title>
    <link rel="icon" type="image/jpg" href="./assets/img/faviconJoke.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="min-h-screen p-4 bg-no-repeat bg-center"
    style="background-image: url('./assets/img/bg.png'); background-size: cover"
  >
    <div
      class="absolute top-8 left-8 w-64 h-64 rounded-full mix-blend-multiply bg-no-repeat bg-cover bg-center hidden md:block z-0"
      style="background-image: url('./assets/img/bg.png')"
    ></div>

    <div
      class="absolute bottom-8 right-8 w-80 h-80 rounded-full mix-blend-multiply bg-no-repeat bg-cover bg-center hidden md:block z-0"
      style="background-image: url('./assets/img/bg.png')"
    ></div>

    <header
      class="absolute top-4 left-4 w-full max-w-xs bg-white/90 backdrop-blur-md rounded-2xl border-2 border-fuchsia-300 shadow-lg p-4 z-10"
      id="weather"
    >
      <section class="text-center" id="weather__display">
        <p class="text-gray-600 text-base">Loading weather...</p>
      </section>
    </header>

    <div class="flex flex-col items-center justify-center min-h-screen gap-6">
      <div
        class="bg-white p-6 md:p-10 rounded-xl shadow-2xl max-w-lg w-full text-center"
      >
        <h1 class="text-4xl font-bold text-fuchsia-600 mb-6">✨ Jokes ✨</h1>

        <p
          id="joke"
          class="text-xl text-gray-700 mb-8 min-h-[50px] flex items-center justify-center"
        >
          Loading joke...
        </p>

        <div class="flex flex-wrap gap-4 mb-4 justify-center">
          <button
            id="btn-score1"
            class="p-2 rounded-lg transition-all duration-200 hover:-translate-y-2"
          >
            <img
              src="./assets/img/rsad.png"
              alt="Rating 1: Not funny"
              class="w-20 h-20 object-contain"
            />
          </button>
          <button
            id="btn-score2"
            class="p-2 rounded-lg transition-all duration-200 hover:-translate-y-2"
          >
            <img
              src="./assets/img/rmed.png"
              alt="Rating 2: Funny"
              class="w-20 h-20 object-contain"
            />
          </button>
          <button
            id="btn-score3"
            class="p-2 rounded-lg transition-all duration-200 hover:-translate-y-2"
          >
            <img
              src="./assets/img/rhappy.png"
              alt="Rating 3: Very funny"
              class="w-20 h-20 object-contain"
            />
          </button>
        </div>

        <div>
          <button
            id="btn"
            class="bg-gradient-to-r from-fuchsia-500 to-purple-600 hover:from-fuchsia-600 hover:to-purple-700 text-white font-semibold py-3 px-8 rounded-lg transition duration-200 shadow-md hover:shadow-xl"
          >
            Next joke
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
